metrics:
- metric_name: otif_pct
  verbose_name: OTIF %
  metric_type: null
  expression: CAST(SUM(otif_shipments) AS NUMERIC) / NULLIF(SUM(closed_shipments), 0)
  description: >-
    OP-01 OTIF: envíos cerrados a tiempo y completos entre envíos cerrados,
    como razón de sumas (nunca promedio de porcentajes). Sin envíos cerrados
    el resultado es nulo y se muestra como sin datos.
  d3format: .1%
  currency: null
  extra: null
