table_name: mart_operations
main_dttm_col: pickup_date
description: >-
  Agregado diario de operación: una fila por fecha de recogida, cliente y ruta
  observados. Solo guarda conteos aditivos; el OTIF se calcula como razón de
  sumas en la métrica «OTIF %».
