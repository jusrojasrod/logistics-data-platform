name: "nexora"
version: "0.1.0"
config-version: 2

profile: "nexora"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

require-dbt-version: [">=1.8.0", "<2.0.0"]

models:
  nexora:
    staging:
      +schema: stg
      +materialized: view
      +tags: ["staging"]
    core:
      +schema: core
      +materialized: table
      +tags: ["core"]
    marts:
      +schema: marts
      +materialized: table
      +tags: ["marts"]

seeds:
  nexora:
    +schema: meta
