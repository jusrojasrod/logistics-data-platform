nexora:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'nexora') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'change-me') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'nexora') }}"
      schema: stg
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10

    ci:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'nexora') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'change-me') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'nexora') }}"
      schema: stg
      threads: 2
