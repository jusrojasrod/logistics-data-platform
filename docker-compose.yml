name: nexora

x-airflow-common: &airflow-common
  build:
    context: ./infra/airflow
    args:
      AIRFLOW_VERSION: "3.4.0"
  image: nexora/airflow:3.4.0
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Bogota
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_PASSWORD:-airflow_dev}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-in-local}
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    PYTHONPATH: /opt/airflow/src
    NEXORA_PG_DSN: postgresql://etl_writer:${ETL_WRITER_PASSWORD:-etl_writer_dev}@postgres:5432/nexora
    NEXORA_MONGO_DSN: mongodb://nexora:${MONGO_INITDB_ROOT_PASSWORD:-change-me}@mongo:27017
    NEXORA_DATA_DIR: /opt/airflow/data
    NEXORA_SCALE: ${NEXORA_SCALE:-demo}
    NEXORA_API_BASE_URL: http://mock-api:8000
    NEXORA_API_TOKEN: ${NEXORA_API_TOKEN:-change-me}
    NEXORA_MONGO_APP_DSN: mongodb://nexora_app:${MONGO_APP_PASSWORD:-change-me}@mongo:27017/?authSource=admin
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./dbt:/opt/airflow/dbt
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data:ro
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    mongo:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: nexora-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-airflow_dev}
      SUPERSET_PASSWORD: ${SUPERSET_PASSWORD:-superset_dev}
      ETL_WRITER_PASSWORD: ${ETL_WRITER_PASSWORD:-etl_writer_dev}
      BI_READER_PASSWORD: ${BI_READER_PASSWORD:-bi_reader_dev}
      DQ_RUNNER_PASSWORD: ${DQ_RUNNER_PASSWORD:-dq_runner_dev}
      TMS_WRITER_PASSWORD: ${TMS_WRITER_PASSWORD:-tms_writer_dev}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=120
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: nexora-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-nexora}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change-me}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 768m
    restart: unless-stopped

  mock-api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    image: nexora/mock-api:0.1.0
    container_name: nexora-mock-api
    environment:
      NEXORA_PG_DSN: postgresql://etl_writer:${ETL_WRITER_PASSWORD:-etl_writer_dev}@postgres:5432/nexora
      NEXORA_MONGO_APP_DSN: mongodb://nexora_app:${MONGO_APP_PASSWORD:-change-me}@mongo:27017/?authSource=admin
      NEXORA_API_TOKEN: ${NEXORA_API_TOKEN:-change-me}
      NEXORA_API_DRIFT: ${NEXORA_API_DRIFT:-0}
      NEXORA_API_BASE_URL: http://mock-api:8000
    ports:
      - "127.0.0.1:${NEXORA_API_PORT:-8090}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: nexora-airflow-init
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER:-admin}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.invalid || true
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    container_name: nexora-airflow-api
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 1200m
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: nexora-airflow-scheduler
    command: scheduler
    mem_limit: 1200m
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: nexora-airflow-dag-processor
    command: dag-processor
    mem_limit: 768m
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: nexora-airflow-triggerer
    command: triggerer
    mem_limit: 512m
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  mongodata:
  airflow-logs:
