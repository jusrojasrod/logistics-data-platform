[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nexora-data-platform"
version = "0.1.0"
description = "Plataforma de analítica y gobierno de datos para una operación logística"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "psycopg[binary]>=3.2,<4",
    "pymongo>=4.8,<5",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "tenacity>=8.5,<9",
    "faker>=25,<30",
    "pandas>=2.2,<3",
    "pyarrow>=16,<19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<0.14",
    "black>=24.8,<26",
]
dbt = [
    "dbt-core>=1.8,<2",
    "dbt-postgres>=1.8,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexora"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nexora", "scripts"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
