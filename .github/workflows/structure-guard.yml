name: structure-guard

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar allowlist de rutas
        run: python scripts/verify_structure.py
