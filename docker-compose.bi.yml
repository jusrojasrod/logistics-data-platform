name: nexora

services:
  redis:
    image: redis:7.4-alpine
    container_name: nexora-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 320m
    restart: unless-stopped

  superset:
    build:
      context: ./infra/superset
      args:
        SUPERSET_VERSION: "6.0.0"
    image: nexora/superset:6.0.0
    container_name: nexora-superset
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me}
      SUPERSET_DB_URI: postgresql+psycopg2://superset:superset_dev@postgres:5432/superset
      REDIS_HOST: redis
      ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: admin@example.invalid
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade &&
        (superset fab create-admin --username "$$ADMIN_USER" --firstname Admin \
          --lastname User --email "$$ADMIN_EMAIL" --password "$$ADMIN_PASSWORD" || true) &&
        superset init &&
        /usr/bin/run-server.sh
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 90s
    mem_limit: 1500m
    restart: unless-stopped

  superset-worker:
    image: nexora/superset:6.0.0
    container_name: nexora-superset-worker
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me}
      SUPERSET_DB_URI: postgresql+psycopg2://superset:superset_dev@postgres:5432/superset
      REDIS_HOST: redis
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker", "--pool=prefork", "--concurrency=2", "-O", "fair"]
    depends_on:
      superset:
        condition: service_healthy
    mem_limit: 768m
    restart: unless-stopped

  superset-beat:
    image: nexora/superset:6.0.0
    container_name: nexora-superset-beat
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me}
      SUPERSET_DB_URI: postgresql+psycopg2://superset:superset_dev@postgres:5432/superset
      REDIS_HOST: redis
    command: ["celery", "--app=superset.tasks.celery_app:app", "beat", "--pidfile", "/tmp/celerybeat.pid", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      superset:
        condition: service_healthy
    mem_limit: 320m
    restart: unless-stopped
